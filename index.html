<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Las Preguntas Mágicas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#7EC8E3;
    --sky-bottom:#DFF6FF;
    --sun:#FFD166;
    --grass-1:#8FCB55;
    --grass-2:#79b849;
    --fox:#FF8C42;
    --fox-dark:#E8672B;
    --fox-belly:#FFF3E4;
    --rabbit:#F8F5F0;
    --rabbit-shadow:#DCD5CC;
    --ink:#2E2140;
    --card:#FFFFFF;
    --option:#F3EFFF;
    --option-border:#DCD1FF;
    --primary:#7C5CFF;
    --primary-dark:#5E3FE0;
    --success:#3FB950;
    --error:#FF6B6B;
    --gold:#FFC93C;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:'Nunito', sans-serif;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 55%, #EFF9E5 100%);
    color:var(--ink);
    -webkit-tap-highlight-color: transparent;
    user-select:none;
  }

  h1,h2,h3,#level-title,#question,.start-btn,#overlay-title{
    font-family:'Baloo 2', sans-serif;
  }
  #sky-decor{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .cloud{ position:absolute; opacity:0.9; animation: drift 40s linear infinite; }
  .cloud svg{ width:90px; }
  .cloud.c1{ top:6%; left:-20%; animation-duration:46s; }
  .cloud.c2{ top:14%; left:-40%; animation-duration:60s; animation-delay:-10s; transform:scale(0.7); }
  .cloud.c3{ top:3%; left:-60%; animation-duration:52s; animation-delay:-25s; transform:scale(0.55); }
  @keyframes drift{ from{ transform:translateX(0);} to{ transform:translateX(160vw);} }

  .sun-wrap{ position:absolute; top:18px; right:18px; width:54px; height:54px; animation:spin 30s linear infinite; }
  @keyframes spin{ from{transform:rotate(0)} to{transform:rotate(360deg)} }

  #game-view{
    width:100%; max-width:420px; height:100%; max-height:900px;
    display:flex; flex-direction:column; padding:18px 18px 22px;
    position:relative; z-index:1;
  }

  #top-bar{
    display:flex; justify-content:space-between; align-items:center;
    font-size:13px; color:var(--ink); font-weight:700; margin-bottom:8px;
  }
  .pill{
    background:rgba(255,255,255,0.85); border-radius:20px; padding:6px 12px;
    display:flex; align-items:center; gap:6px; box-shadow:0 2px 6px rgba(0,0,0,0.08);
  }
  .pill svg{ width:16px; height:16px; }
  #score{ transition: transform 0.25s ease; display:inline-block; }
  #score.bump{ transform: scale(1.35); }
  
  .top-btn-group { display: flex; gap: 8px; }
  .icon-btn {
    background:rgba(255,255,255,0.85); border:none; border-radius:50%;
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.08); transition: transform 0.1s ease;
  }
  .icon-btn:active { transform: scale(0.9); }
  .icon-btn svg { width:16px; height:16px; }

  #level-title{
    text-align:center; font-size:19px; font-weight:700; color:var(--primary-dark);
    margin:6px 0 2px; min-height:24px;
  }
  #level-sub{ text-align:center; font-size:12.5px; color:#6b6280; margin-bottom:10px; font-weight:600; }

  #race-wrap{
    background:linear-gradient(180deg, var(--grass-2), var(--grass-1));
    border-radius:16px; padding:8px 10px 6px; margin-bottom:8px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.08);
    position:relative; overflow:hidden;
  }
  #race-track{ position:relative; height:46px; margin-bottom:2px; }
  #den{ position:absolute; right:-2px; bottom:-2px; width:34px; height:30px; }
  #racer-rabbit, #racer-fox{
    position:absolute; bottom:2px; width:38px; height:34px; transition: left 0.95s linear;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.15));
  }
  #racer-rabbit{ z-index:3; }
  #racer-fox{ z-index:2; }
  .run-bounce{ animation: run-bounce 0.32s ease-in-out infinite; }
  @keyframes run-bounce{ 0%,100%{ transform: translateY(0) rotate(-2deg); } 50%{ transform: translateY(-5px) rotate(2deg); } }
  .poof{ position:absolute; bottom:6px; width:26px; height:26px; opacity:0; }
  .poof.show{ animation: poof-pop 0.6s ease-out forwards; }
  @keyframes poof-pop{ 0%{ opacity:0; transform:scale(0.3); } 40%{ opacity:1; transform:scale(1.2); } 100%{ opacity:0; transform:scale(1.8); } }
  #time-label{ text-align:center; font-size:11px; color:#fff; font-weight:800; text-shadow:0 1px 2px rgba(0,0,0,0.25); }
  #paw-progress{ display:flex; justify-content:center; gap:8px; margin-bottom:10px; }
  .paw{ width:16px; height:16px; opacity:0.35; transition: all 0.3s ease; }
  .paw.filled{ opacity:1; transform:scale(1.15); }
  #question-container{
    flex-grow:1; display:flex; flex-direction:column; justify-content:center;
    background:var(--card); border-radius:22px; padding:20px 16px;
    box-shadow:0 8px 20px rgba(46,33,64,0.12);
  }
  #level-icon-wrap{ display:flex; justify-content:center; margin-bottom:8px; }
  #level-icon-wrap svg{ width:46px; height:46px; }
  
  #question-image {
    display: none; max-width: 100%; max-height: 130px; object-fit: contain;
    border-radius: 12px; margin: 0 auto 15px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  }
  #question{ font-size:19px; font-weight:700; text-align:center; line-height:1.4; margin-bottom:20px; color:var(--ink); }

  .btn{
    background:var(--option); border:2.5px solid var(--option-border);
    padding:14px 16px; margin:7px 0; border-radius:16px;
    cursor:pointer; text-align:center; font-size:15.5px; font-weight:700;
    color:var(--ink); transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn.correct{ background:var(--success); border-color:#2ea043; color:white; animation: correct-pop 0.4s ease; }
  .btn.wrong{ background:var(--error); border-color:#e14848; color:white; animation: shake 0.45s ease; }
  @keyframes correct-pop{ 0%{ transform:scale(1); } 40%{ transform:scale(1.06); } 100%{ transform:scale(1); } }
  @keyframes shake{ 0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-6px); } 40%{ transform:translateX(6px); } 60%{ transform:translateX(-4px); } 80%{ transform:translateX(4px); } }
  #popup{
    position:absolute; top:44%; left:50%; transform:translate(-50%,-50%);
    font-size:30px; font-weight:800; opacity:0; pointer-events:none;
    text-shadow:0 4px 14px rgba(0,0,0,0.25); text-align:center; width:100%; z-index:15;
    display:flex; flex-direction:column; align-items:center; gap:4px; line-height: 1.1;
  }
  #popup svg{ width:52px; height:52px; }
  .show-popup{ animation: float-up 1.15s ease-out forwards; }
  @keyframes float-up{ 0%{ opacity:0; transform:translate(-50%,25px) scale(0.7); } 18%{ opacity:1; transform:translate(-50%,0) scale(1.15); } 30%{ transform:translate(-50%,0) scale(1); } 80%{ opacity:1; transform:translate(-50%,-45px) scale(1); } 100%{ opacity:0; transform:translate(-50%,-65px) scale(0.9); } }
  #confetti-layer{ position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:14; }
  .confetti-piece{ position:absolute; top:-10px; border-radius:2px; opacity:0.95; animation: confetti-fall linear forwards; }
  @keyframes confetti-fall{ to{ transform: translateY(115vh) rotate(540deg); opacity:0.2; } }
  #level-overlay{
    position:absolute; inset:0; z-index:20;
    background:linear-gradient(180deg, rgba(126,200,227,0.97), rgba(223,246,255,0.98));
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    padding:0 26px; opacity:0; pointer-events:none; transition:opacity 0.3s ease;
  }
  #level-overlay.active{ opacity:1; pointer-events:all; }
  #mascot-wrap{ width:120px; height:120px; margin-bottom:6px; animation: mascot-bob 2.4s ease-in-out infinite; }
  @keyframes mascot-bob{ 0%,100%{ transform:translateY(0) rotate(-1.5deg); } 50%{ transform:translateY(-8px) rotate(1.5deg); } }
  #overlay-title{ color:var(--primary-dark); text-align:center; margin:0; font-size:23px; }
  #overlay-desc{ color:#4a4260; text-align:center; margin-top:8px; font-size:14.5px; font-weight:600; line-height:1.4; }
  .start-btn{
    margin-top:26px; background:var(--primary); color:white; border:none;
    padding:15px 34px; border-radius:30px; font-size:18px; font-weight:700;
    cursor:pointer; box-shadow:0 6px 0 var(--primary-dark); transition: transform 0.1s ease;
  }
  .start-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--primary-dark); }
  .start-btn:disabled { background: #a694db; box-shadow: 0 6px 0 #8573ba; cursor: not-allowed; }
  #leaderboard-container {
    margin-top: 15px; width: 100%; max-width: 320px; background: rgba(255, 255, 255, 0.95);
    border-radius: 16px; padding: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none; 
  }
  #leaderboard-container h3 { margin: 0 0 10px 0; text-align: center; color: var(--primary-dark); font-size: 17px; }
  .leaderboard-table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  .leaderboard-table th, .leaderboard-table td { padding: 8px 6px; text-align: left; border-bottom: 1px solid #eef; color: var(--ink); }
  .leaderboard-table th { font-weight: 700; color: #6b6280; }
  #player-name-input {
    margin-top: 20px; padding: 12px; border-radius: 20px; border: 3px solid var(--primary);
    width: 80%; max-width: 280px; font-family: 'Nunito', sans-serif; font-size: 15px;
    font-weight: 700; text-align: center; color: var(--ink); display: none; outline: none;
  }
  .save-btn { margin-top: 12px; background: var(--success); box-shadow: 0 6px 0 #2ea043; display: none; }
  .save-btn:active { box-shadow: 0 2px 0 #2ea043; }

  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; } }
</style>
</head>

<div id="sky-decor">

      icon: "pencil",
      questions: [
        { q: "¿Cuál oración está escrita correctamente para hacer una pregunta al director?", a: ["¿A qué hora empieza el torneo de fútbol en la escuela?", "A qué hora empieza el torneo de fútbol en la escuela?", "¡A qué hora empieza el torneo de fútbol en la escuela!"], correct: 0, points: 100, time: 15, image: null },
        { q: "Uso de signos: ¿Qué signos se usan para expresar sorpresa o emoción en una nota informativa?", a: ["Signos de interrogación (¿?)", "Signos de admiración (¡!)"], correct: 1, points: 100, time: 10, image: null }
      ]
    }
  ];

  const icons = {
    newspaper: '<svg viewBox="0 0 48 48"><rect x="6" y="8" width="36" height="32" rx="3" fill="#7C5CFF"/><rect x="11" y="14" width="12" height="10" rx="1.5" fill="white"/><rect x="26" y="14" width="11" height="4" rx="1" fill="white"/><rect x="26" y="20" width="11" height="4" rx="1" fill="white"/><rect x="11" y="27" width="26" height="3" rx="1.2" fill="white"/><rect x="11" y="33" width="26" height="3" rx="1.2" fill="white"/></svg>',
    pencil: '<svg viewBox="0 0 48 48"><rect x="7" y="10" width="26" height="30" rx="3" fill="white" stroke="#7C5CFF" stroke-width="2.5"/><rect x="12" y="16" width="16" height="2.6" rx="1.3" fill="#DCD1FF"/><rect x="12" y="22" width="16" height="2.6" rx="1.3" fill="#DCD1FF"/><rect x="12" y="28" width="10" height="2.6" rx="1.3" fill="#DCD1FF"/><g transform="translate(27,25) rotate(45)"><rect x="0" y="-4" width="20" height="8" rx="2" fill="#FFC93C"/><polygon points="20,-4 26,0 20,4" fill="#FF8C42"/><rect x="-3" y="-4" width="4" height="8" fill="#7C5CFF"/></g></svg>',
    handshake: '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="#FFF3E4"/><path d="M10 24l7-6 5 4 5-4 7 6-4 5-3-2-3 4-3-4-3 2z" fill="#FF8C42"/><circle cx="24" cy="12" r="4" fill="#7C5CFF"/></svg>'
  };

  let currentLevel = 0, currentQuestion = 0, score = 0, timeLeft = 10, timerInterval = null;
  let currentTotalTime = 10; 
  let muted = false, audioCtx = null, questionLocked = false;

  document.addEventListener('DOMContentLoaded', async () => {
    const startBtn = document.getElementById('main-start-btn');
    document.getElementById('leaderboard-container').style.display = 'block';
    loadLeaderboard();
    
    try {
      const doc = await db.collection("config").doc("gameData").get();
      if (doc.exists && doc.data().levels && doc.data().levels.length > 0) {
        gameData = doc.data().levels;
      }
      startBtn.innerText = "¡Comenzar!";
      startBtn.disabled = false;
    } catch(err) {
      console.error("Error al cargar datos, usando preguntas locales:", err);
      startBtn.innerText = "¡Comenzar! (Modo Offline)";
      startBtn.disabled = false;
    }
  });

  function ensureAudio(){
    if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ audioCtx = null; } }
    if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume(); }
  }
  function tone(freq, start, dur, type='sine', peakGain=0.18){
    if(!audioCtx || muted) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    const t0 = audioCtx.currentTime + start;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(peakGain, t0 + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function playCorrectSound(){ tone(523,0,0.16,'triangle'); tone(659,0.09,0.16,'triangle'); tone(784,0.18,0.22,'triangle'); }
  function playWrongSound(){ tone(300,0,0.18,'sawtooth',0.12); tone(220,0.1,0.24,'sawtooth',0.12); }
  function playTimeoutSound(){ tone(392,0,0.14,'square',0.1); tone(261,0.13,0.22,'square',0.1); }
  function playLevelUpSound(){ tone(523,0,0.15,'triangle'); tone(659,0.12,0.15,'triangle'); tone(784,0.24,0.15,'triangle'); tone(1047,0.38,0.3,'triangle'); }
  function playClickSound(){ tone(700,0,0.06,'sine',0.08); }

  function toggleMute(){
    ensureAudio(); muted = !muted;
    document.getElementById('wave1').style.opacity = muted ? 0.15 : 1;
    document.getElementById('wave2').style.opacity = muted ? 0.15 : 1;
  }

  function exitGame() {
    if(!confirm("¿Estás seguro de que quieres salir? Perderás tu progreso actual y Foxym se pondrá triste.")) return;
    
    clearInterval(timerInterval);
    currentLevel = 0;
    score = 0;
    document.getElementById('score').innerText = score;
    document.getElementById('player-name-input').style.display = 'none';
    document.getElementById('save-score-btn').style.display = 'none';
    document.getElementById('leaderboard-container').style.display = 'block';
    showOverlay("Las Preguntas Mágicas", "¿Listo para demostrar tus habilidades junto al zorro Foxym?", "¡Comenzar!");
    loadLeaderboard();
  }
  function showOverlay(title, desc, btnText){
    document.getElementById('overlay-title').innerText = title;
    document.getElementById('overlay-desc').innerText = desc;
    document.getElementById('main-start-btn').innerText = btnText;
    document.getElementById('level-overlay').classList.add('active');
  }

  function startLevel(){
    ensureAudio(); playClickSound();
    document.getElementById('level-overlay').classList.remove('active');
    
    document.getElementById('player-name-input').style.display = 'none';
    document.getElementById('save-score-btn').style.display = 'none';
    document.getElementById('leaderboard-container').style.display = 'none';
    document.getElementById('main-start-btn').style.display = 'inline-block';
    
    if(currentLevel >= gameData.length) { currentLevel = 0; score = 0; }
    currentQuestion = 0;
    loadQuestion();
  }
  function renderPaws(total, answered){
    const wrap = document.getElementById('paw-progress');
    wrap.innerHTML = '';
    for(let i=0;i<total;i++){
      const span = document.createElement('span');
      span.className = 'paw' + (i < answered ? ' filled' : '');
      span.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="15" r="6" fill="#7C5CFF"/><circle cx="5" cy="7" r="3" fill="#7C5CFF"/><circle cx="12" cy="4" r="3" fill="#7C5CFF"/><circle cx="19" cy="7" r="3" fill="#7C5CFF"/></svg>';
      wrap.appendChild(span);
    }
  }

  function loadQuestion(){
    questionLocked = false;
    const levelData = gameData[currentLevel];
    const qData = levelData.questions[currentQuestion];

    currentTotalTime = qData.time || 10;

    document.getElementById('ui-level').innerText = `${currentLevel + 1}/${gameData.length}`;
    document.getElementById('level-title').innerText = levelData.name;
    document.getElementById('ui-q-current').innerText = currentQuestion + 1;
    document.getElementById('ui-q-total').innerText = levelData.questions.length;
    document.getElementById('score').innerText = score;
    document.getElementById('level-icon-wrap').innerHTML = icons[levelData.icon] || '';

    renderPaws(levelData.questions.length, currentQuestion);
    
    const imgEl = document.getElementById('question-image');
    if (qData.image) {
      imgEl.src = qData.image;
      imgEl.style.display = 'block';
    } else {
      imgEl.style.display = 'none';
      imgEl.src = '';
    }

    document.getElementById('question').innerText = qData.q;

    const opts = document.getElementById('options');
    opts.innerHTML = '';
    qData.a.forEach((txt, i) => {
      const b = document.createElement('div');
      b.className = 'btn'; b.innerText = txt;
      b.onclick = () => checkAnswer(i, b);
      opts.appendChild(b);
    });

    resetRace(); startTimer();
  }
  function resetRace(){
    document.getElementById('racer-fox').style.left = '4%';
    document.getElementById('racer-rabbit').style.left = '76%';
    document.getElementById('poof-svg').classList.remove('show');
    document.getElementById('racer-rabbit').style.opacity = 1;
    document.getElementById('time-num').innerText = currentTotalTime;
    document.getElementById('time-label').style.color = '';
  }

  function updateRace(t){
    const progress = (currentTotalTime - t) / currentTotalTime;
    document.getElementById('racer-fox').style.left = (4 + progress * 66) + '%';
    if(t <= 3) document.getElementById('time-label').style.color = '#FFD9D9';
  }

  function startTimer(){
    timeLeft = currentTotalTime; 
    clearInterval(timerInterval);
    
    timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById('time-num').innerText = Math.max(timeLeft, 0);
      updateRace(timeLeft);
      if(timeLeft <= 0){ clearInterval(timerInterval); handleTimeout(); }
    }, 1000);
  }

  function lockButtons(){ document.querySelectorAll('.btn').forEach(btn => btn.style.pointerEvents = 'none'); }

  function checkAnswer(selectedIndex, buttonElement){
    if(questionLocked) return;
    questionLocked = true; clearInterval(timerInterval); lockButtons();

    const qData = gameData[currentLevel].questions[currentQuestion];
    const correctIndex = qData.correct;
    const allBtns = document.querySelectorAll('.btn');

    if(selectedIndex === correctIndex){
      buttonElement.classList.add('correct');
      const maxPts = qData.points || 100;
      const percentage = timeLeft / currentTotalTime;
      const pointsEarned = Math.max(Math.ceil(maxPts * percentage), 1);
      
      score += pointsEarned;
      
      bumpScore(); spawnConfetti();
      showFloatingFeedback(true, `¡ACERTASTE!<br><span style="font-size:22px; color:#c6ffd2;">+${pointsEarned} pts</span>`);
      playCorrectSound();
    } else {
      buttonElement.classList.add('wrong');
      allBtns[correctIndex].classList.add('correct');
      showFloatingFeedback(false, "¡CASI!");
      playWrongSound();
    }
  }

  function handleTimeout(){
    if(questionLocked) return;
    questionLocked = true; lockButtons();
    const correctIndex = gameData[currentLevel].questions[currentQuestion].correct;
    document.querySelectorAll('.btn')[correctIndex].classList.add('correct');

    document.getElementById('racer-fox').style.left = '72%';
    const poof = document.getElementById('poof-svg');
    poof.style.left = '78%'; poof.classList.add('show');
    document.getElementById('racer-rabbit').style.opacity = 0;

    showFloatingFeedback(false, "¡TIEMPO FUERA!");
    playTimeoutSound();
  }

  function bumpScore(){
    const el = document.getElementById('score');
    el.innerText = score; el.classList.add('bump');
    setTimeout(() => el.classList.remove('bump'), 260);
  }
  function spawnConfetti(){
    const layer = document.getElementById('confetti-layer');
    const colors = ['#7C5CFF','#FFC93C','#FF8C42','#3FB950','#FF6B6B','#5EC8F2'];
    for(let i=0;i<26;i++){
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      const size = 6 + Math.random()*6;
      p.style.width = size + 'px'; p.style.height = (size*0.4) + 'px';
      p.style.left = (Math.random()*100) + '%';
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      p.style.animationDuration = (1.1 + Math.random()*0.9) + 's';
      p.style.transform = `rotate(${Math.random()*360}deg)`;
      layer.appendChild(p);
      setTimeout(() => p.remove(), 2200);
    }
  }

  /* ---------------- Popup ---------------- */
  const popupIcons = {
    correct: '<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="28" fill="#3FB950"/><path d="M18 31l8 8 16-17" stroke="white" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    wrong: '<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="28" fill="#FF8C42"/><path d="M20 20l20 20M40 20l-20 20" stroke="white" stroke-width="4.5" stroke-linecap="round"/></svg>',
    timeout: '<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="28" fill="#FF6B6B"/><path d="M30 16v14l9 9" stroke="white" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };

  function showFloatingFeedback(isCorrect, text){
    const popup = document.getElementById('popup');
    let icon = isCorrect ? popupIcons.correct : (text.includes('TIEMPO') ? popupIcons.timeout : popupIcons.wrong);
    popup.innerHTML = icon + `<span style="color:${isCorrect ? '#2ea043' : '#e8672b'}">${text}</span>`;
    popup.classList.remove('show-popup'); void popup.offsetWidth; popup.classList.add('show-popup');
    setTimeout(() => { popup.classList.remove('show-popup'); nextQuestion(); }, 1250);
  }
  function nextQuestion(){
    currentQuestion++;
    const levelData = gameData[currentLevel];

    if(currentQuestion < levelData.questions.length){
      loadQuestion();
    } else {
      clearInterval(timerInterval);
      currentLevel++; playLevelUpSound();
      if(currentLevel < gameData.length){
        showOverlay("¡Nivel Completado!", `Desbloqueaste: ${gameData[currentLevel].name}`, "Siguiente Nivel");
      } else {
        showOverlay("¡Felicidades!", `Terminaste el entrenamiento con ${score} puntos.`, "Jugar de nuevo");
        setupEndGameUI();
      }
    }
  }

  function setupEndGameUI() {
    document.getElementById('main-start-btn').style.display = 'none';
    document.getElementById('player-name-input').style.display = 'block';
    document.getElementById('save-score-btn').style.display = 'inline-block';
    document.getElementById('leaderboard-container').style.display = 'block';
    loadLeaderboard();
  }

  function saveScore() {
    const nameInput = document.getElementById('player-name-input').value.trim();
    if (!nameInput) return alert("Por favor, ingresa un nombre válido.");
    
    document.getElementById('player-name-input').style.display = 'none';
    document.getElementById('save-score-btn').style.display = 'none';

    db.collection("leaderboard").add({
      name: nameInput, score: score, date: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
      loadLeaderboard();
      document.getElementById('main-start-btn').style.display = 'inline-block';
    }).catch((error) => {
      console.error("Error al guardar puntuación: ", error);
      alert("Hubo un error al guardar tu puntuación.");
      document.getElementById('main-start-btn').style.display = 'inline-block';
    });
  }

  function loadLeaderboard() {
    const container = document.getElementById('leaderboard-container');
    const tbody = document.getElementById('leaderboard-body');
    
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Cargando datos...</td></tr>';

    db.collection("leaderboard").orderBy("score", "desc").limit(5).get().then((querySnapshot) => {
        tbody.innerHTML = ''; let rank = 1;
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          tbody.innerHTML += `<tr><td>#${rank}</td><td>${data.name}</td><td><b>${data.score}</b></td></tr>`;
          rank++;
        });
        if(querySnapshot.empty) tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Aún no hay puntuaciones. ¡Sé el primero!</td></tr>';
      }).catch((error) => {
        console.error("Error al cargar la tabla: ", error);
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Error al cargar la tabla.</td></tr>';
      });
  }
</script>
</body>
</html>
