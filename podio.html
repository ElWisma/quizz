<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tabla de Campeones · Las Preguntas Mágicas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#7EC8E3;
    --sky-bottom:#DFF6FF;
    --sun:#FFD166;
    --grass-1:#8FCB55;
    --grass-2:#79b849;
    --fox:#FF8C42;
    --fox-dark:#E8672B;
    --fox-belly:#FFF3E4;
    --ink:#2E2140;
    --card:#FFFFFF;
    --primary:#7C5CFF;
    --primary-dark:#5E3FE0;
    --success:#3FB950;
    --gold:#FFC93C;
    --gold-dark:#E8A80E;
    --silver:#D6DEE8;
    --silver-dark:#9CAAB8;
    --bronze:#E3A25D;
    --bronze-dark:#B9743A;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; }
  body{
    font-family:'Nunito', sans-serif;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 55%, #EFF9E5 100%);
    color:var(--ink);
    -webkit-tap-highlight-color: transparent;
    user-select:none;
    width:100vw; height:100vh;
    display:flex; flex-direction:column;
    position:relative;
  }
  h1,h2,.card-name,.slot-empty,.overlay-title{ font-family:'Baloo 2', sans-serif; }

  /* ---------- decor ---------- */
  #sky-decor{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .cloud{ position:absolute; opacity:0.9; animation: drift linear infinite; }
  .cloud svg{ width:110px; }
  .cloud.c1{ top:6%; left:-20%; animation-duration:52s; }
  .cloud.c2{ top:16%; left:-40%; animation-duration:68s; animation-delay:-10s; transform:scale(0.7); }
  .cloud.c3{ top:3%; left:-60%; animation-duration:60s; animation-delay:-25s; transform:scale(0.55); }
  .cloud.c4{ top:24%; left:-80%; animation-duration:75s; animation-delay:-40s; transform:scale(0.5); }
  @keyframes drift{ from{ transform:translateX(0);} to{ transform:translateX(160vw);} }
  .sun-wrap{ position:absolute; top:2.5vh; right:2.5vh; width:64px; height:64px; animation:spin 30s linear infinite; }
  @keyframes spin{ from{transform:rotate(0)} to{transform:rotate(360deg)} }
  #ground{
    position:fixed; left:0; right:0; bottom:0; height:10vh; z-index:0;
    background:linear-gradient(180deg, var(--grass-2), var(--grass-1));
    box-shadow: inset 0 4px 0 rgba(255,255,255,0.25);
  }

  /* ---------- top bar ---------- */
  #top-bar{
    position:relative; z-index:2;
    display:flex; align-items:center; justify-content:space-between;
    padding:1.6vh 2.4vw 0.6vh;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand svg{ width:clamp(34px,4vh,52px); height:clamp(34px,4vh,52px); filter:drop-shadow(0 3px 3px rgba(0,0,0,0.15)); }
  .brand h1{ margin:0; font-size:clamp(20px,3vh,32px); color:var(--primary-dark); letter-spacing:0.2px; }
  .brand .sub{ font-size:clamp(10px,1.3vh,13px); font-weight:700; color:#6b6280; margin-top:-2px; }
  #right-controls{ display:flex; align-items:center; gap:12px; }
  .live-pill{
    display:flex; align-items:center; gap:7px; background:rgba(255,255,255,0.85);
    border-radius:20px; padding:7px 14px; font-weight:800; font-size:clamp(11px,1.4vh,14px);
    box-shadow:0 2px 6px rgba(0,0,0,0.08); color:#3a3350;
  }
  .live-dot{ width:9px; height:9px; border-radius:50%; background:#3FB950; box-shadow:0 0 0 0 rgba(63,185,80,0.6); animation:pulse-dot 1.6s ease-out infinite; }
  @keyframes pulse-dot{ 0%{ box-shadow:0 0 0 0 rgba(63,185,80,0.55);} 70%{ box-shadow:0 0 0 9px rgba(63,185,80,0);} 100%{ box-shadow:0 0 0 0 rgba(63,185,80,0);} }
  .icon-btn{
    background:rgba(255,255,255,0.85); border:none; border-radius:50%;
    width:clamp(34px,4.4vh,46px); height:clamp(34px,4.4vh,46px); display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.08); transition: transform 0.1s ease;
  }
  .icon-btn:active{ transform:scale(0.9); }
  .icon-btn svg{ width:52%; height:52%; }

  /* ---------- stage ---------- */
  #stage{
    position:relative; z-index:1; flex:1; min-height:0;
    display:flex; align-items:stretch; gap:2vw;
    padding:0 2.4vw 10vh;
  }

  /* podium */
  #podium-area{ flex:1.55; display:flex; align-items:flex-end; justify-content:center; min-width:0; }
  .podium-flex{ display:flex; align-items:flex-end; gap:clamp(10px,2.2vw,34px); width:100%; max-width:900px; justify-content:center; }
  .stand{ display:flex; flex-direction:column; align-items:center; width:30%; perspective:1200px; }
  .stand.order-2{ order:1; }
  .stand.order-1{ order:2; }
  .stand.order-3{ order:3; }

  .card{
    width:100%; background:var(--card); border-radius:18px;
    padding:clamp(8px,1.4vh,16px) clamp(6px,1vw,14px) clamp(12px,1.8vh,18px);
    box-shadow:0 10px 22px rgba(46,33,64,0.18);
    display:flex; flex-direction:column; align-items:center; gap:6px;
    margin-bottom:12px; position:relative;
    transform-style:preserve-3d;
    transition: transform 0.55s cubic-bezier(.2,.8,.2,1);
  }
  .card.flip{ animation: card-flip 0.7s ease; }
  @keyframes card-flip{
    0%{ transform:rotateY(0deg) scale(1); }
    45%{ transform:rotateY(90deg) scale(0.85); }
    55%{ transform:rotateY(90deg) scale(0.85); }
    100%{ transform:rotateY(0deg) scale(1); }
  }
  .crown-wrap{ position:absolute; top:-30px; width:44px; height:34px; animation: crown-bob 2.2s ease-in-out infinite; }
  @keyframes crown-bob{ 0%,100%{ transform:translateY(0) rotate(-4deg);} 50%{ transform:translateY(-5px) rotate(4deg);} }
  .medal{ position:absolute; top:-20px; width:34px; height:34px; }

  .avatar{
    width:clamp(46px,7vh,74px); height:clamp(46px,7vh,74px); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2',sans-serif; font-weight:800; color:white;
    font-size:clamp(18px,2.6vh,28px);
    box-shadow:0 4px 10px rgba(0,0,0,0.18);
    border:3px solid white;
  }
  .stand.order-1 .avatar{ background:linear-gradient(160deg, var(--gold), var(--gold-dark)); }
  .stand.order-2 .avatar{ background:linear-gradient(160deg, var(--silver), var(--silver-dark)); }
  .stand.order-3 .avatar{ background:linear-gradient(160deg, var(--bronze), var(--bronze-dark)); }

  .card-name{ font-weight:700; font-size:clamp(13px,2vh,20px); text-align:center; line-height:1.15; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card-score{ font-weight:800; font-size:clamp(16px,2.6vh,26px); color:var(--primary-dark); display:flex; align-items:baseline; gap:4px; }
  .card-score .pts-label{ font-size:0.5em; font-weight:700; color:#8b83a0; }
  .slot-empty{ font-size:clamp(11px,1.6vh,15px); color:#a89fc0; font-weight:700; padding:6px 0; }

  .pedestal{
    width:100%; border-radius:12px 12px 0 0; display:flex; align-items:flex-start; justify-content:center;
    box-shadow: inset 0 3px 0 rgba(255,255,255,0.35), 0 -2px 8px rgba(0,0,0,0.05);
    position:relative; transition: height 0.5s ease;
  }
  .pedestal span{ margin-top:8px; font-family:'Baloo 2',sans-serif; font-weight:800; color:rgba(255,255,255,0.85); text-shadow:0 2px 3px rgba(0,0,0,0.15); }
  .p1{ height:clamp(90px,17vh,190px); background:linear-gradient(180deg, var(--gold), var(--gold-dark)); }
  .p1 span{ font-size:clamp(26px,4vh,48px); }
  .p2{ height:clamp(64px,12vh,140px); background:linear-gradient(180deg, var(--silver), var(--silver-dark)); }
  .p2 span{ font-size:clamp(20px,3.2vh,36px); }
  .p3{ height:clamp(48px,9vh,105px); background:linear-gradient(180deg, var(--bronze), var(--bronze-dark)); }
  .p3 span{ font-size:clamp(20px,3.2vh,36px); }

  .stand.pop-in{ animation: pop-in 0.6s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes pop-in{ 0%{ transform:translateY(40px) scale(0.7); opacity:0; } 100%{ transform:translateY(0) scale(1); opacity:1; } }
  .stand.champion-glow .card{ animation: champion-glow 1.4s ease-in-out; }
  @keyframes champion-glow{
    0%{ box-shadow:0 10px 22px rgba(46,33,64,0.18); }
    30%{ box-shadow:0 0 0 8px rgba(255,201,60,0.55), 0 10px 22px rgba(46,33,64,0.18); }
    100%{ box-shadow:0 10px 22px rgba(46,33,64,0.18); }
  }
  .score-bump{ animation: score-bump 0.3s ease; }
  @keyframes score-bump{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.25); color:var(--success); } }

  /* ranking side panel */
  #ranking-panel{
    flex:1; min-width:0; display:flex; flex-direction:column;
    background:rgba(255,255,255,0.72); border-radius:22px;
    padding:clamp(10px,1.8vh,20px) clamp(10px,1.4vw,20px);
    box-shadow:0 8px 20px rgba(46,33,64,0.10);
    backdrop-filter: blur(2px);
  }
  #ranking-panel h2{
    margin:0 0 8px; font-size:clamp(14px,2vh,19px); color:var(--primary-dark); text-align:center;
  }
  #rank-list{
    list-style:none; margin:0; padding:0; overflow:hidden; flex:1; position:relative;
    display:flex; flex-direction:column; gap:8px;
  }
  #rank-list-inner{ display:flex; flex-direction:column; gap:8px; transition: transform 0.9s linear; }
  .rank-row{
    display:flex; align-items:center; gap:10px;
    background:var(--card); border-radius:14px; padding:8px 12px;
    box-shadow:0 2px 6px rgba(0,0,0,0.06);
    flex:0 0 auto;
  }
  .rank-row .rank-num{
    width:clamp(24px,3vh,32px); height:clamp(24px,3vh,32px); border-radius:50%;
    background:var(--option, #F3EFFF); background:#F0ECFF; color:var(--primary-dark);
    display:flex; align-items:center; justify-content:center; font-weight:800;
    font-size:clamp(11px,1.5vh,14px); flex-shrink:0;
  }
  .rank-row .rank-avatar{
    width:clamp(24px,3vh,32px); height:clamp(24px,3vh,32px); border-radius:50%; flex-shrink:0;
    background:linear-gradient(160deg, var(--fox), var(--fox-dark)); color:white;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:clamp(11px,1.4vh,14px);
  }
  .rank-row .rank-name{ flex:1; font-weight:700; font-size:clamp(12px,1.6vh,15px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rank-row .rank-score{ font-weight:800; color:var(--primary-dark); font-size:clamp(12px,1.7vh,16px); }
  .rank-row.row-enter{ animation: row-enter 0.55s ease; }
  @keyframes row-enter{ 0%{ opacity:0; transform:translateX(30px) scale(0.9); } 100%{ opacity:1; transform:translateX(0) scale(1); } }
  .rank-row.row-flash{ animation: row-flash 1.1s ease; }
  @keyframes row-flash{ 0%{ background:#FFF3C4; } 100%{ background:var(--card); } }
  #list-empty{ text-align:center; color:#a89fc0; font-weight:700; font-size:clamp(12px,1.6vh,15px); margin-top:10px; }

  /* confetti + toast */
  #confetti-layer{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:30; }
  .confetti-piece{ position:absolute; top:-10px; border-radius:2px; opacity:0.95; animation: confetti-fall linear forwards; }
  @keyframes confetti-fall{ to{ transform: translateY(115vh) rotate(540deg); opacity:0.2; } }

  #toast-layer{ position:fixed; top:2vh; left:50%; transform:translateX(-50%); z-index:40; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
  .toast{
    background:linear-gradient(135deg, var(--primary), var(--primary-dark)); color:white;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:clamp(13px,1.8vh,18px);
    padding:10px 22px; border-radius:30px; box-shadow:0 8px 18px rgba(94,63,224,0.35);
    animation: toast-in 0.4s ease, toast-out 0.5s ease 2.4s forwards;
    display:flex; align-items:center; gap:8px;
  }
  @keyframes toast-in{ 0%{ opacity:0; transform:translateY(-16px) scale(0.9);} 100%{ opacity:1; transform:translateY(0) scale(1);} }
  @keyframes toast-out{ 0%{ opacity:1;} 100%{ opacity:0; transform:translateY(-10px);} }

  /* start / loading overlay */
  #loading-overlay{
    position:fixed; inset:0; z-index:50; background:linear-gradient(180deg, rgba(126,200,227,0.97), rgba(223,246,255,0.98));
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    transition:opacity 0.4s ease;
  }
  #loading-overlay.hidden{ opacity:0; pointer-events:none; }
  #loading-overlay .mascot{ width:110px; height:110px; animation: mascot-bob 2.4s ease-in-out infinite; }
  @keyframes mascot-bob{ 0%,100%{ transform:translateY(0) rotate(-1.5deg); } 50%{ transform:translateY(-8px) rotate(1.5deg); } }
  #loading-overlay .overlay-title{ color:var(--primary-dark); font-size:22px; margin:0; }
  #loading-overlay p{ color:#4a4260; font-weight:700; font-size:14px; margin:0; }

  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; } }
</style>
</head>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDJaoXKhI8QJ0i36hicpGGC21gDRAvMDRg",
    authDomain: "quizzrepor.firebaseapp.com",
    projectId: "quizzrepor",

    messagingSenderId: "648203197422",

  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const TOTAL_SHOWN = 10; // top 3 podio + hasta 7 en la lista

  /* ---------------- sonido ---------------- */
  let muted = false, audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ audioCtx=null; } }
    if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume(); }
  }
  function tone(freq, start, dur, type='sine', peakGain=0.18){
    if(!audioCtx || muted) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    const t0 = audioCtx.currentTime + start;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(peakGain, t0 + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function playNewEntrySound(){ tone(660,0,0.12,'triangle'); tone(880,0.1,0.16,'triangle'); }
  function playRankUpSound(){ tone(523,0,0.1,'triangle'); tone(659,0.08,0.1,'triangle'); tone(784,0.16,0.14,'triangle'); }
  function playChampionSound(){ tone(523,0,0.14,'triangle'); tone(659,0.11,0.14,'triangle'); tone(784,0.22,0.14,'triangle'); tone(1047,0.34,0.32,'triangle'); }

  const muteBtn = document.getElementById('mute-btn');
  muteBtn.addEventListener('click', () => {
    ensureAudio(); muted = !muted;
    document.getElementById('wave1').style.opacity = muted ? 0.15 : 1;
    document.getElementById('wave2').style.opacity = muted ? 0.15 : 1;
  });
  // El navegador requiere una interacción para permitir audio; intenta desbloquear en el primer click en cualquier parte.
  document.body.addEventListener('click', ensureAudio, { once:true });

  /* ---------------- iconos ---------------- */
  const crownSVG = '<svg viewBox="0 0 44 34"><polygon points="22,2 34,20 10,20" fill="var(--gold)"/><circle cx="10" cy="20" r="4" fill="var(--gold)"/><circle cx="22" cy="6" r="4" fill="var(--gold)"/><circle cx="34" cy="20" r="4" fill="var(--gold)"/><rect x="8" y="20" width="28" height="10" rx="2" fill="var(--gold)"/></svg>';
  const medalSilverSVG = '<svg viewBox="0 0 34 34"><circle cx="17" cy="19" r="13" fill="var(--silver)" stroke="var(--silver-dark)" stroke-width="2"/><polygon points="10,2 24,2 20,10 14,10" fill="#B7C2CE"/></svg>';
  const medalBronzeSVG = '<svg viewBox="0 0 34 34"><circle cx="17" cy="19" r="13" fill="var(--bronze)" stroke="var(--bronze-dark)" stroke-width="2"/><polygon points="10,2 24,2 20,10 14,10" fill="#C98A50"/></svg>';
  document.getElementById('crown-1').innerHTML = crownSVG;
  document.getElementById('medal-2').innerHTML = medalSilverSVG;
  document.getElementById('medal-3').innerHTML = medalBronzeSVG;

  function initials(name){
    return (name || '?').trim().split(/\s+/).slice(0,2).map(w => w[0]?.toUpperCase() || '').join('') || '?';
  }

  /* ---------------- confeti / toast ---------------- */
  function spawnConfetti(originYvh){
    const layer = document.getElementById('confetti-layer');
    const colors = ['#7C5CFF','#FFC93C','#FF8C42','#3FB950','#FF6B6B','#5EC8F2'];
    for(let i=0;i<34;i++){
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      const size = 6 + Math.random()*6;
      p.style.width = size + 'px'; p.style.height = (size*0.4) + 'px';
      p.style.left = (Math.random()*100) + '%';
      p.style.top = (originYvh || 0) + 'vh';
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      p.style.animationDuration = (1.3 + Math.random()*1.1) + 's';
      p.style.transform = `rotate(${Math.random()*360}deg)`;
      layer.appendChild(p);
      setTimeout(() => p.remove(), 2600);
    }
  }
  function showToast(text){
    const layer = document.getElementById('toast-layer');
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = '🏆 ' + text;
    layer.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

  /* ---------------- estado ---------------- */
  let prevRankById = new Map(); // id -> rank (1-based) de la última renderización
  let firstLoad = true;

  function animateNumber(el, from, to, dur=650){
    if(from === to){ el.textContent = to; return; }
    const start = performance.now();
    function step(now){
      const p = Math.min((now-start)/dur, 1);
      const eased = 1 - Math.pow(1-p, 3);
      el.textContent = Math.round(from + (to-from)*eased);
      if(p < 1) requestAnimationFrame(step); else el.textContent = to;
    }
    requestAnimationFrame(step);
  }

  function renderPodium(top3){
    for(let rank=1; rank<=3; rank++){
      const occ = top3[rank-1] || null;
      const stand = document.getElementById('stand-' + rank);
      const nameEl = document.getElementById('name-' + rank);
      const scoreEl = document.getElementById('score-' + rank);
      const avatarEl = document.getElementById('avatar-' + rank);
      const card = stand.querySelector('.card');
      const prevId = stand.dataset.occupant || null;
      const prevScore = parseInt(scoreEl.textContent, 10) || 0;

      if(!occ){
        stand.dataset.occupant = '';
        nameEl.textContent = 'Esperando…';
        scoreEl.textContent = '0';
        avatarEl.textContent = '–';
        continue;
      }

      const occupantChanged = prevId !== occ.id;

      if(occupantChanged){
        stand.dataset.occupant = occ.id;
        nameEl.textContent = occ.name;
        avatarEl.textContent = initials(occ.name);
        scoreEl.textContent = occ.score;
        if(!firstLoad){
          card.classList.remove('flip'); void card.offsetWidth; card.classList.add('flip');
          stand.classList.remove('champion-glow'); void stand.offsetWidth;
          if(rank === 1){
            stand.classList.add('champion-glow');
            spawnConfetti(20);
            playChampionSound();
            showToast(occ.name + ' ¡nuevo campeón!');
          } else {
            playRankUpSound();
          }
        }
      } else {
        nameEl.textContent = occ.name;
        if(occ.score !== prevScore){
          animateNumber(scoreEl, prevScore, occ.score);
          scoreEl.classList.remove('score-bump'); void scoreEl.offsetWidth; scoreEl.classList.add('score-bump');
        }
      }
    }
  }

  function renderList(rest){
    const inner = document.getElementById('rank-list-inner');
    const emptyMsg = document.getElementById('list-empty');
    emptyMsg.style.display = rest.length ? 'none' : 'block';

    // FLIP: posiciones previas
    const firstRects = new Map();
    inner.querySelectorAll('.rank-row').forEach(row => {
      firstRects.set(row.dataset.id, row.getBoundingClientRect());
    });

    const existingIds = new Set(Array.from(inner.querySelectorAll('.rank-row')).map(r => r.dataset.id));
    inner.innerHTML = '';

    rest.forEach((occ, idx) => {
      const rank = idx + 4;
      const row = document.createElement('div');
      row.className = 'rank-row';
      row.dataset.id = occ.id;
      row.innerHTML = `
        <div class="rank-num">${rank}</div>
        <div class="rank-avatar">${initials(occ.name)}</div>
        <div class="rank-name">${escapeHtml(occ.name)}</div>
        <div class="rank-score">${occ.score} pts</div>
      `;
      inner.appendChild(row);

      const isNew = !existingIds.has(occ.id);
      if(isNew && !firstLoad){
        row.classList.add('row-enter');
        playNewEntrySound();
        showToast(occ.name + ' se une a la tabla');
      }
    });

    // Aplica FLIP a las filas que ya existían y cambiaron de posición
    inner.querySelectorAll('.rank-row').forEach(row => {
      const f = firstRects.get(row.dataset.id);
      if(f){
        const l = row.getBoundingClientRect();
        const dy = f.top - l.top;
        if(Math.abs(dy) > 1){
          row.style.transition = 'none';
          row.style.transform = `translateY(${dy}px)`;
          requestAnimationFrame(() => {
            row.style.transition = 'transform 0.6s cubic-bezier(.2,.8,.2,1)';
            row.style.transform = '';
          });
        }
      }
    });
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function handleSnapshot(docs){
    const top3 = docs.slice(0, 3);
    const rest = docs.slice(3, TOTAL_SHOWN);

    renderPodium(top3);
    renderList(rest);

    document.getElementById('loading-overlay').classList.add('hidden');
    firstLoad = false;
  }

  db.collection('leaderboard').orderBy('score', 'desc').limit(TOTAL_SHOWN)
    .onSnapshot(snapshot => {
      const docs = snapshot.docs.map(d => ({ id: d.id, name: (d.data().name || '???'), score: (d.data().score || 0) }));
      handleSnapshot(docs);
    }, err => {
      console.error('Error al escuchar la tabla:', err);
      document.getElementById('loading-overlay').classList.add('hidden');
    });

  /* auto-scroll suave si la lista lateral no cabe (para proyección sin interacción) */
  (function autoScrollLoop(){
    const wrap = document.getElementById('rank-list');
    const inner = document.getElementById('rank-list-inner');
    let offset = 0, dir = -1, pause = 0;
    function tick(){
      const overflow = inner.scrollHeight - wrap.clientHeight;
      if(overflow > 4){
        if(pause > 0){ pause--; }
        else {
          offset += dir * 0.35;
          if(offset <= -overflow){ offset = -overflow; dir = 1; pause = 45; }
          if(offset >= 0){ offset = 0; dir = -1; pause = 45; }
          inner.style.transform = `translateY(${offset}px)`;
        }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();
</script>
</body>
</html>
